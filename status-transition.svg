<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 640" width="740" height="640" font-family="'Yu Gothic UI','Yu Gothic','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <title>ステータス遷移（13状態）</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #b5b5b5; stroke-width: 1.2; }
    .end { fill: #ebebe8; stroke: #b5b5b5; stroke-width: 1.2; }
    .key { fill: #e3edf9; stroke: #3d7bd6; stroke-width: 2; }
    .lbl { font-size: 14px; fill: #222; text-anchor: middle; dominant-baseline: central; }
    .lblb { font-size: 14px; fill: #222; text-anchor: middle; dominant-baseline: central; font-weight: bold; }
    .edge { fill: none; stroke: #9a9a9a; stroke-width: 1.3; marker-end: url(#arrow); }
    .elbl { font-size: 11.5px; fill: #555; }
  </style>
  <rect width="740" height="640" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#111">法人内移動を優先し、外部譲渡は回答日で価格を確定する</text>
  <text x="20" y="46" font-size="12" fill="#666">網掛けの枠＝終了状態</text>

  <!-- 行: y = 80 + i*80, 箱の高さ 44 / 列: x = 20, 270, 520, 幅 200 -->
  <!-- 1列目 -->
  <rect class="box" x="20" y="80" width="200" height="44" rx="5"/><text class="lbl" x="120" y="102">在庫中</text>
  <rect class="box" x="20" y="160" width="200" height="44" rx="5"/><text class="lbl" x="120" y="182">要対応</text>
  <rect class="box" x="20" y="240" width="200" height="44" rx="5"/><text class="lbl" x="120" y="262">法人内移動検討中</text>
  <rect class="end" x="20" y="320" width="200" height="44" rx="5"/><text class="lbl" x="120" y="342">移動完了</text>
  <!-- 2列目 -->
  <rect class="box" x="270" y="160" width="200" height="44" rx="5"/><text class="lbl" x="370" y="182">外部募集中</text>
  <rect class="box" x="270" y="240" width="200" height="44" rx="5"/><text class="lbl" x="370" y="262">見積中（回答期限つき）</text>
  <rect class="key" x="270" y="320" width="200" height="44" rx="5"/><text class="lblb" x="370" y="342">引取決定・価格確定</text>
  <rect class="box" x="270" y="400" width="200" height="44" rx="5"/><text class="lbl" x="370" y="422">引渡予定</text>
  <rect class="box" x="270" y="480" width="200" height="44" rx="5"/><text class="lbl" x="370" y="502">引渡完了・代金受領</text>
  <!-- 3列目 -->
  <rect class="end" x="520" y="80" width="200" height="44" rx="5"/><text class="lbl" x="620" y="102">返品・買取業者・廃棄</text>
  <rect class="box" x="520" y="240" width="200" height="44" rx="5"/><text class="lbl" x="620" y="262">期限切れ</text>
  <rect class="box" x="520" y="480" width="200" height="44" rx="5"/><text class="lbl" x="620" y="502">手数料支払待ち</text>
  <rect class="end" x="520" y="560" width="200" height="44" rx="5"/><text class="lbl" x="620" y="582">完了</text>

  <!-- 1列目の縦の流れ -->
  <path class="edge" d="M120,124 V158"/><text class="elbl" x="128" y="145">自動判定</text>
  <path class="edge" d="M120,204 V238"/>
  <path class="edge" d="M120,284 V318"/><text class="elbl" x="128" y="305">成立</text>
  <!-- 要対応 → 返品・買取業者・廃棄 -->
  <path class="edge" d="M220,176 H236 V102 H518"/><text class="elbl" x="380" y="95" text-anchor="middle">返品・買取・廃棄を選ぶ</text>
  <!-- 法人内移動検討中 → 外部募集中（不成立） -->
  <path class="edge" d="M220,262 H250 V190 H268"/><text class="elbl" x="226" y="254">不成立</text>
  <!-- 2列目の縦の流れ -->
  <path class="edge" d="M370,204 V238"/><text class="elbl" x="378" y="225">引取希望あり</text>
  <path class="edge" d="M370,284 V318"/><text class="elbl" x="378" y="305">回答で掛率確定</text>
  <path class="edge" d="M370,364 V398"/>
  <path class="edge" d="M370,444 V478"/>
  <!-- 見積中 → 期限切れ → 外部募集中 -->
  <path class="edge" d="M470,262 H518"/><text class="elbl" x="494" y="254" text-anchor="middle">回答なし</text>
  <path class="edge" d="M620,240 V182 H472"/><text class="elbl" x="628" y="214">再募集</text>
  <!-- 引渡完了 → 手数料支払待ち → 完了 -->
  <path class="edge" d="M470,502 H518"/><text class="elbl" x="494" y="494" text-anchor="middle">運搬者</text>
  <path class="edge" d="M620,524 V558"/><text class="elbl" x="628" y="545">翌月振込</text>
  <!-- 引渡完了 → 完了（直接引渡） -->
  <path class="edge" d="M370,524 V582 H518"/><text class="elbl" x="444" y="574" text-anchor="middle">直接引渡</text>
</svg>
